spring.application.name=taskqueue
# Baza de date H2, salvata pe fisier (supravietuieste restart-ului)
spring.datasource.url=jdbc:h2:file:./data/taskqueue;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate: creeaza/actualizeaza tabelele automat pe baza entitatilor
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
